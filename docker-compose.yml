services:
  jekyll:
    build: .
    ports:
      - "4000:4000"   # live site
      - "35729:35729" # livereload websocket
    volumes:
      - .:/site
      # Keep gems inside the image — don't let the volume mount shadow them
      - bundle_cache:/usr/local/bundle
    environment:
      - JEKYLL_ENV=development
      - PAGES_REPO_NWO=jmieses/jmportfolio

  # One-shot build check — used by Claude Code to verify changes before commit
  # Usage: docker compose run --rm build-check
  build-check:
    build: .
    volumes:
      - .:/site
      - bundle_cache:/usr/local/bundle
    environment:
      - JEKYLL_ENV=production
      - PAGES_REPO_NWO=jmieses/jmportfolio
    command: bundle exec jekyll build --trace

volumes:
  bundle_cache:
